<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#2a2a2c" />
    <meta
      name="description"
      content="《ID Plan》— 室内设计项目节点管理系统：把合同变成一张看得懂的阶段时间轴。"
    />
    <title>ID Plan</title>
    <!-- 运行时配置注入点（Docker / 绿联容器端在启动时覆盖，实现不重构镜像切换数据源）：
         构建期占位 local；容器内由 /env-config.js 覆盖 window.__APP_ENV__ -->
    <script>
      window.__APP_ENV__ = { VITE_DATA_SOURCE: 'local', VITE_API_BASE_URL: '' };
    </script>
  </head>
  <body>
    <!-- 宋体系衬线标题字体为本地字体栈优先（离线优先原则，不强拉网络字体）；
         如需更佳视觉可在部署环境自行放置 Noto Serif SC 并在 global.css 中扩充 -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
