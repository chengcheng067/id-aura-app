# =====================================================================
# ID Plan · 导出「绿联 UPK 专用」镜像 tar
#
# 为什么单独一个工作流？
#   绿联官方 Docker 应用（UPK）要求把镜像以 tar 形式放进
#   rootfs_<arch>/images/，随包一起安装。官方要求用 `docker save` 导出
#   （Docker 格式：含 manifest.json + repositories），而原有的
#   docker-build.yml 导出的是 buildx 的 OCI 格式（含 oci-layout +
#   index.json），绿联不一定认。这里改成 pull → tag → docker save，
#   格式和 tag 都可控。
#
# 为什么是 pull 而不是重新 build？
#   镜像已经在 docker-build.yml 里构建并推送到 ghcr 了（多架构 manifest
#   list），直接按架构拉取再另存，速度快得多，且内容与已验证的一致。
#
# 产物（Release 资产）：
#   idplan-amd64-upk.tar          前端 amd64
#   idplan-backend-amd64-upk.tar  后端 amd64
#   idplan-arm64-upk.tar          前端 arm64
#   idplan-backend-arm64-upk.tar  后端 arm64
#
# tar 内部 tag 固定为：
#   idplan:0.3.0 / idplan-backend:0.3.0
# 必须与 ugnas/upk/rootfs_common/docker-compose.yaml 里的 image: 完全一致。
#
# 触发：手动 workflow_dispatch（在 Actions 页面点 Run workflow）
# =====================================================================
name: upk-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本号（默认 0.3.0，需与 ghcr 上已存在的 tag 一致）"
        required: false
        default: "0.3.0"

env:
  REGISTRY: ghcr.io
  OWNER: chengcheng067
  FRONT: idplan
  BACK: idplan-backend

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 确定版本号
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="0.3.0"; fi
          echo "VERSION=${VER}" >> "$GITHUB_ENV"

      - name: 导出 amd64 镜像 tar
        run: |
          set -e
          mkdir -p upk-images
          for pair in "${{ env.FRONT }}:${{ env.FRONT }}" "${{ env.BACK }}:${{ env.BACK }}"; do
            name="${pair%%:*}";
            docker pull --platform linux/amd64 \
              ${{ env.REGISTRY }}/${{ env.OWNER }}/${name}:${{ env.VERSION }}
            docker tag \
              ${{ env.REGISTRY }}/${{ env.OWNER }}/${name}:${{ env.VERSION }} \
              ${name}:${{ env.VERSION }}
            docker save -o upk-images/${name}-amd64-upk.tar ${name}:${{ env.VERSION }}
            echo "=== ${name}:${{ env.VERSION }} (amd64) ==="
            tar -tf upk-images/${name}-amd64-upk.tar | head -20
          done

      - name: 导出 arm64 镜像 tar
        run: |
          set -e
          mkdir -p upk-images
          for name in "${{ env.FRONT }}" "${{ env.BACK }}"; do
            docker pull --platform linux/arm64 \
              ${{ env.REGISTRY }}/${{ env.OWNER }}/${name}:${{ env.VERSION }}
            docker tag \
              ${{ env.REGISTRY }}/${{ env.OWNER }}/${name}:${{ env.VERSION }} \
              ${name}:${{ env.VERSION }}
            docker save -o upk-images/${name}-arm64-upk.tar ${name}:${{ env.VERSION }}
            echo "=== ${name}:${{ env.VERSION }} (arm64) ==="
            tar -tf upk-images/${name}-arm64-upk.tar | head -20
          done

      - name: 校验 tar 内的 tag
        run: |
          set -e
          cd upk-images
          for f in *.tar; do
            echo "--- $f ---"
            # docker save 格式必然包含 manifest.json，其 RepoTags 就是要核对的 tag
            tar -xf "$f" -O manifest.json
            echo ""
          done
          ls -lh

      - name: 上传 tar 到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ID Plan UPK Images ${{ env.VERSION }}"
          tag_name: "upk-images-${{ env.VERSION }}"
          files: upk-images/*.tar
          fail_on_unmatched_files: true
