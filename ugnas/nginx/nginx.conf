# =====================================================================
# ID Plan · nginx 站点配置（SPA 回退 + 运行时配置注入 + /api 反向代理）
#
# 双路径支持：
#   A. 直接宿主机访问（tab 模式 / 打印窗口 / 本地调试）：http://NAS-IP:28080/
#      —— location / 直接服务 Vite 产物。
#   B. 绿联 inner 模式：http://NAS-IP:28080/<proxy_path>/   （gateway 不剥前缀）
#      —— location /idplan/ 服务同一份产物 + /idplan/api/ 反代。
#   inner 模式的 URL 自带 /idplan/ 前缀进入 nginx，因此「SPA 回退 + 静态资源 +
#   运行时配置 + /api 反代」都必须处理该前缀。Vite 镜像内产物落在根目录
#   （base 只改 URL 引用，不改文件系统布局），故前缀位置用 rewrite 把 /idplan/<x> 变回 /<x>。
# =====================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 运行时配置注入（内外路径） ----------
    # no-store 确保浏览器每次拿到最新数据源配置
    location = /env-config.js {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri =404;
    }
    # inner：gateway 转发的 /idplan/env-config.js → 镜像内 /env-config.js
    location = /idplan/env-config.js {
        rewrite ^/idplan/(.*)$ /$1 break;
        try_files $uri =404;
    }

    # ---------- 静态资源长缓存（内外路径） ----------
    # Vite 产物文件名带 hash，内容变了文件名就变
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # inner：/idplan/assets/xxx → 镜像内 /assets/xxx
    location /idplan/assets/ {
        rewrite ^/idplan/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- /api 反向代理 → 后端容器（团队共享数据层） ----------
    # 前端同源访问 /api，由 nginx 转发到 backend:7788，浏览器无需直连后端端口。
    # 主机名 backend 由 compose 的 links 提供（network_mode: bridge 下无服务名 DNS）。
    location /api/ {
        proxy_pass http://backend:7788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 备份导入/导出体量较大（整库 JSON），放宽缓冲区与超时
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }
    # inner：/idplan/api/xxx → 反代到后端并剥掉 /idplan 前缀，后端拿到 /api/xxx。
    # rewrite 到 /api/xxx 后走上面 proxypass 的通用块；用 break 避免二次改写。
    location /idplan/api/ {
        rewrite ^/idplan/api(/.*)$ /api$1 break;
        proxy_pass http://backend:7788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # ---------- SPA 回退：非文件请求一律回 index.html ----------
    # tab / 直接宿主机访问
    location / {
        try_files $uri $uri/ /index.html;
    }
    # inner：gateway 转发的 /idplan/ 前缀。剥前缀后走同一套静态回退。
    location /idplan/ {
        rewrite ^/idplan/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }
}
