# =====================================================================
# ID Plan · nginx 站点配置（SPA 回退 + 运行时配置注入 + /api 反向代理占位）
# =====================================================================
server {
    listen 80;
    server_name _;

    # 根目录：Vite 构建产物
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源长缓存（Vite 产物文件名带 hash，内容变了文件名就变）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 运行时配置：由 entrypoint 渲染，覆盖 window.__APP_ENV__
    # no-store 确保浏览器每次拿到最新数据源配置
    location = /env-config.js {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri =404;
    }

    # SPA 回退：非文件请求一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- /api 反向代理 → 后端容器（团队共享数据层） ----
    # 前端同源访问 /api，由 nginx 转发到 backend:7788，浏览器无需直连后端端口，
    # 也就不存在跨域问题（后端 CORS 全开是二道保险）。
    # 主机名 backend 由 compose 的 links 提供（network_mode: bridge 下无服务名 DNS）。
    location /api/ {
        proxy_pass http://backend:7788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 备份导入/导出体量较大（整库 JSON），放宽缓冲区与超时
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }
}
