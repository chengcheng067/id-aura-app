# =====================================================================
# ID Plan · nginx 站点配置（SPA 回退 + 运行时配置注入 + /api 反向代理占位）
# =====================================================================
server {
    listen 80;
    server_name _;

    # 根目录：Vite 构建产物
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源长缓存（Vite 产物文件名带 hash，内容变了文件名就变）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 运行时配置：由 entrypoint 渲染，覆盖 window.__APP_ENV__
    # no-store 确保浏览器每次拿到最新数据源配置
    location = /env-config.js {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri =404;
    }

    # SPA 回退：非文件请求一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- /api 反向代理占位 ----
    # 预留：绿联容器端若启用 remote 数据源（多端同步），后端 API 由本容器代理。
    # 目前镜像仅托管静态站；启用时请取消注释并指向真实后端，或改用 VITE_API_BASE_URL 直连。
    # location /api/ {
    #     proxy_pass http://backend:PORT;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
